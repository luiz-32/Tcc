<div class="login-container">
  <!-- Seta de voltar -->
  <a href="inicial" class="seta-voltar">←</a>

  <div class="login-box">
    <h1>CADASTRO</h1>

    <form (ngSubmit)="adicionarUsuario()" #form="ngForm">
      <div class="form-group">
        <label for="nome">NOME DE USUÁRIO</label>
        <input
          id="nome"
          placeholder="Digite seu nome de usuário"
          name="nome_usuario"
          [(ngModel)]="novoUsuario.nome_usuario"
          required
        />
      </div>

      <div class="form-group">
        <label for="senha">SENHA</label>
        <input
          id="senha"
          placeholder="Digite sua senha"
          name="senha"
          [(ngModel)]="novoUsuario.senha"
          type="password"
          required
        />
      </div>

      <button type="submit" [disabled]="form.invalid">CADASTRAR</button>
    </form>

    <!-- Mensagem de feedback -->
    <p *ngIf="mensagem" class="mensagem" [ngClass]="tipoMensagem">
      {{ mensagem }}
    </p>
  </div>
</div>
