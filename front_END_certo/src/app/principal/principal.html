<div class="principal-container">

  <app-navbar 
    [usuarioNome]="usuarioNome"
    (sairEvent)="sair()"
    (search)="pesquisarAlimentos($event)">
  </app-navbar>


  <!-- ✅ TELA INICIAL COM AS DIETAS -->
  <div *ngIf="!tipoDieta && !modoPesquisa" class="dieta-container">
    <div class="dietas">
      
      <button class="dieta-card" (click)="mudarDieta('VEGANO')">
        <img src="foto/vegano.jpg" class="fotodieta">
        <span>VEGANA</span>
      </button>

      <button class="dieta-card" (click)="mudarDieta('VEGETARIANO')">
        <img src="foto/vegetariano.jpg" class="fotodieta">
        <span>VEGETARIANA</span>
      </button>

      <button class="dieta-card" (click)="mudarDieta('INTOLERANTE Á LACTOSE')">
        <img src="foto/intolerante.jpg" class="fotodieta">
        <span>INTOLERANTE Á LACTOSE</span>
      </button>

      <button class="dieta-card" (click)="mudarDieta('OVOLACTOVEGETARIANO')">
        <img src="foto/ovolacto.jpg" class="fotodieta">
        <span>OVOLACTOVEGETARIANO</span>
      </button>

      <button class="dieta-card" (click)="mudarDieta('INTOLERANTE Á GLUTEN')">
        <img src="foto/gluten.jpg" class="fotodieta">
        <span>INTOLERANTE Á GLÚTEN</span>
      </button>

    </div>
  </div>


  <!-- ✅ LISTA DA DIETA -->
  <div *ngIf="tipoDieta && !modoPesquisa" class="alimentos-container">

    <div class="header">
      <h1>{{ tipoDieta }}</h1>
      <button class="voltar" (click)="voltar()">⬅ Voltar</button>
    </div>

    <div class="lista">
      <div class="alimento-item"
          *ngFor="let alimento of alimentosRecomendados"
          (click)="abrirModal(alimento)">

        <img [src]="'http://localhost:3000/' + alimento.imagem" class="fotoalimento">
        <span>{{ alimento.nome }}</span>

      </div>
    </div>
  </div>


  <!-- ✅ RESULTADO DA PESQUISA -->
  <div *ngIf="modoPesquisa" class="alimentos-container">

    <div class="header">
      <h1>Resultado da pesquisa</h1>
      <button class="voltar" (click)="sairPesquisa()">⬅ Voltar</button>
    </div>

    <div class="lista">

      <div class="alimento-item"
          *ngFor="let alimento of resultadosPesquisa"
          (click)="abrirModal(alimento)">

        <img [src]="'http://localhost:3000/' + alimento.imagem" class="fotoalimento">
        <span>{{ alimento.nome }}</span>

      </div>

      <p *ngIf="resultadosPesquisa.length === 0" style="color:white;margin-top:20px;">
        Nenhum alimento encontrado.
      </p>

    </div>
  </div>


  <!-- ✅ MODAL -->
  <div class="modal-overlay" *ngIf="alimentoSelecionado" (click)="fecharModal()">
    <div class="modal-conteudo" (click)="$event.stopPropagation()">

      <img [src]="'http://localhost:3000/' + alimentoSelecionado.imagem"
           class="modal-foto">

      <h2>{{ alimentoSelecionado.nome }}</h2>

      <p class="descricao">
        {{ alimentoSelecionado.descricao }}
      </p>

      <button class="fechar-btn" (click)="fecharModal()">Fechar</button>
    </div>
  </div>

</div>
