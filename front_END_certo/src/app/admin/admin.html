<div class="admin-panel">
  <div class="admin-header">
    <h2>Painel do Administrador</h2>
    <div class="admin-actions">
      <button class="btn-logout" (click)="logoutAdmin()">Sair do Admin</button>
    </div>
  </div>

  <!-- Usuários panel removed as requested -->

  <section class="panel">
    <div class="panel-header" (click)="toggleAlimentos()" role="button" aria-expanded="{{showAlimentos}}">
      <h3>Alimentos</h3>
      <button class="toggle-btn" type="button">{{ showAlimentos ? 'Ocultar' : 'Mostrar' }}</button>
    </div>
    <div class="panel-body" [class.collapsed]="!showAlimentos">
      <div class="panel-actions">
        <button (click)="carregarAlimentos()" type="button">Recarregar</button>
      </div>
      <ul class="alimentos-list">
        <li *ngFor="let a of alimentos">
          <div class="alimento-row">
            <img *ngIf="a.imagem" [src]="('http://localhost:3000/' + a.imagem)" class="thumb" />
            <div class="alimento-info">{{a.id}} — {{a.nome}} <span class="cat-label" *ngIf="a.id_categoria">(categoria: {{a.id_categoria}})</span></div>
            <div class="alimento-actions">
              <button type="button" (click)="editAlimento(a)">Editar</button>
              <button type="button" (click)="deleteAlimento(a.id)">Excluir</button>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </section>

  <section>
    <h3>Criar Alimento</h3>
    <form class="criar-form" (submit)="$event.preventDefault(); criarAlimento()">
      <div class="form-row">
        <label>Nome</label>
        <input [(ngModel)]="novo.nome" name="nome" placeholder="Ex: Cevada" />
      </div>

      <div class="form-row">
        <label>Descrição</label>
        <textarea [(ngModel)]="novo.descricao" name="descricao" rows="3" placeholder="Breve descrição..."></textarea>
      </div>

      <div class="form-row">
        <label>Categoria</label>
        <select [(ngModel)]="novo.id_categoria" name="id_categoria">
          <option [ngValue]="null">-- Sem categoria --</option>
          <option *ngFor="let c of categorias" [value]="c.id">{{ c.id }} — {{ c.nome }}</option>
        </select>
      </div>

      <div class="form-row file-row">
        <div class="file-input">
          <label class="file-label">Enviar imagem</label>
          <input type="file" (change)="onFileSelected($event)" accept="image/*" />
        </div>
        <div *ngIf="novo.imagem" class="preview">
          <small>Preview</small>
          <img [src]="(novo.imagem.startsWith('http') ? novo.imagem : 'http://localhost:3000/' + novo.imagem)" class="thumb preview-thumb" />
        </div>
      </div>

      <div class="form-row check-row">
        <label><input type="checkbox" [(ngModel)]="novo.vegetariano" name="vegetariano" /> Vegetariano</label>
        <label><input type="checkbox" [(ngModel)]="novo.vegano" name="vegano" /> Vegano</label>
        <label><input type="checkbox" [(ngModel)]="novo.ovolacto" name="ovolacto" /> Ovolacto</label>
        <label><input type="checkbox" [(ngModel)]="novo.intolerante_lactose" name="lactose" /> Intolerante Lactose</label>
        <label><input type="checkbox" [(ngModel)]="novo.intolerante_gluten" name="gluten" /> Intolerante Glúten</label>
      </div>

      <div class="form-actions">
        <button class="btn-primary" type="submit">{{ editingId ? 'Salvar alterações' : 'Criar' }}</button>
        <button *ngIf="editingId" type="button" class="btn-muted" (click)="(editingId=null); novo = { nome: '', descricao: '', imagem: '', vegetariano: false, vegano: false, ovolacto: false, intolerante_lactose: false, intolerante_gluten: false, id_categoria: null }">Cancelar edição</button>
      </div>
    </form>
  </section>
</div>
