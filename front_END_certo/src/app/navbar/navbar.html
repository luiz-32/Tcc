<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    
    <!-- Logo -->
    <img src="foto/logo.png" alt="Logo" class="logo">

    <!-- Campo de busca -->
    <form class="d-flex mx-auto search-form" (submit)="onSubmit($event)">
      <input class="form-control search-input"
             type="search"
             placeholder="Pesquise por alimentos, categorias, dietas..."
             aria-label="Search"
              [(ngModel)]="termo"
              name="searchTerm"
              #searchInput>
      <button type="submit" class="search-btn" title="Pesquisar">🔍</button>
            <button *ngIf="termo && termo.trim().length > 0" type="button" class="search-clear" title="Limpar pesquisa" (click)="clearSearch($event)">✖</button>
    </form>

    <!-- Menu de Navegação -->
    <div class="nav-menu">
      <div class="container-fluid">
        <ul class="nav-list">
          <li class="nav-item">
            <a href="#" class="nav-link" data-section="home" [class.active]="activeSection === 'home'" (click)="emitNavigate($event, 'home')">INÍCIO</a>
          </li>

          <li class="nav-item">
            <a href="#" class="nav-link" data-section="sobre" [class.active]="activeSection === 'sobre'" (click)="emitNavigate($event, 'sobre')">SOBRE NÓS</a>
          </li>

          <li class="nav-item dropdown-nav">
            <a href="#" class="nav-link" data-section="categorias" [class.active]="activeSection === 'categorias'" (click)="emitNavigate($event, 'categorias')">CATEGORIAS</a>
          </li>

          <li class="nav-item dropdown-nav">
            <a href="#" class="nav-link" data-section="dietas" [class.active]="activeSection === 'dietas'" (click)="emitNavigate($event, 'dietas')">DIETAS</a>
          </li>
        </ul>
      </div>
    </div>

    <!-- diagnostic UI removed -->

    <!-- Entrar / Cadastrar (aparecem à esquerda do perfil quando não logado) -->
    <div *ngIf="!usuarioNome" class="auth-actions">
      <button type="button" class="btn-login-nav" (click)="triggerLogin()">Entrar</button>
      <button type="button" class="btn-cadastro-nav" (click)="triggerCadastro()">Cadastrar</button>
    </div>

    <!-- Perfil -->
    <div class="dropdown">
      <a href="#" 
         class="d-flex align-items-center text-decoration-none"
         id="profileDropdown"
         data-bs-toggle="dropdown"
         aria-expanded="false"
         (click)="handleProfileClick($event)">

         <img *ngIf="usuarioNome && fotoUrl" [src]="fotoUrl" alt="Avatar" class="nav-avatar" />
         <div *ngIf="usuarioNome && !fotoUrl" class="nav-placeholder"></div>
         <svg *ngIf="!usuarioNome && !fotoUrl" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
           <circle cx="20" cy="20" r="18" stroke="#000000" stroke-width="2"/>
           <circle cx="20" cy="16" r="6" stroke="#000000" stroke-width="2" fill="none"/>
           <path d="M8 32C8 26 12 22 20 22C28 22 32 26 32 32" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
         </svg>
      </a>

      <ul class="dropdown-menu dropdown-menu-end p-3" aria-labelledby="profileDropdown">
        <div class="perfil-header text-center mb-2">
          <strong>Olá, {{ usuarioNome || 'Desconhecido' }}</strong>
        </div>

        <!-- Tabs / Links (stacked vertically) -->
        <div class="perfil-tabs mb-2">
          <a class="dropdown-item" (click)="openPerfil()">👤 Ver Perfil</a>
          <a class="dropdown-item" (click)="exibirFavoritos()">⭐ Meus Favoritos</a>
          <a class="dropdown-item" (click)="sair()">🚪 Sair</a>
        </div>

        <!-- Segurança: trocar senha -->
        <div *ngIf="perfilTab === 'seguranca'" class="seguranca-pane p-2">
          <label class="form-label">Senha Atual</label>
          <input type="password" class="form-control mb-2" [(ngModel)]="oldPassword" name="oldPassword" />

          <label class="form-label">Nova Senha</label>
          <input type="password" class="form-control mb-2" [(ngModel)]="newPassword" name="newPassword" />

          <label class="form-label">Confirmar Nova Senha</label>
          <input type="password" class="form-control mb-2" [(ngModel)]="confirmPassword" name="confirmPassword" />

          <div class="d-flex justify-content-end">
            <button class="btn btn-save" (click)="submitChangePassword()">Alterar Senha</button>
          </div>
        </div>

        <!-- Exclusão de conta -->
        <div *ngIf="perfilTab === 'excluir'" class="excluir-pane p-2 text-center">
          <p class="text-muted small">Excluir sua conta é irreversível. Todos os seus dados serão removidos.</p>
          <button class="btn btn-danger" (click)="triggerDeleteAccount()">Excluir Conta</button>
        </div>
      </ul>
    </div>

  </div>
</nav>
