<nav class="navbar navbar-expand-lg"
  style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 100;
    height: 100px;
    background-color: #31c063;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  ">

  <div class="container-fluid d-flex justify-content-between align-items-center">
    
    <!-- 🟢 Logo -->
    <img src="foto/logo.png" alt="Logo" class="logo">

    <!-- 🔵 Campo de busca -->
    <form class="d-flex mx-auto"
          style="width: 50%; max-width: 400px;"
          (submit)="onSubmit($event)">
      
      <input class="form-control me-2"
             type="search"
             placeholder="Pesquisar alimento..."
             aria-label="Search"
             [(ngModel)]="termo"
             name="searchTerm">

      <button type="submit" class="btn">🔍</button>
    </form>

    <!-- 🔴 Perfil -->
    <div class="dropdown me-3">
      <a href="#" 
         class="d-flex align-items-center text-decoration-none dropdown-toggle"
         id="profileDropdown"
         data-bs-toggle="dropdown"
         aria-expanded="false" style="color: #d3d3d3; font-size: 20px;">
         PERFIL
      </a>

      <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="profileDropdown">
        <li>
          <span class="dropdown-item-text fw-bold text-center">
            👋 {{ usuarioNome || 'Desconhecido' }}
          </span>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="#">Configurações</a></li>
        <li><a class="dropdown-item text-danger" (click)="sair()">🚪 Sair</a></li>
      </ul>
    </div>

  </div>
</nav>
