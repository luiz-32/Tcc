<div class="perfil-container">
  <a class="seta-voltar" href="/principal">← Voltar</a>

  <div class="perfil-box">
    <h1>Meu Perfil</h1>

    <!-- Header area with avatar and quick actions -->
    <div class="perfil-header-area">
      <div class="header-avatar">
        <img *ngIf="usuarioId && fotoUrl" [src]="fotoUrl" alt="Foto de perfil" class="perfil-img" />
        <div *ngIf="!fotoUrl" class="perfil-placeholder">Sem foto</div>
      </div>
      <div class="header-info">
        <strong class="header-name">{{ usuarioNome || 'Usuário' }}</strong>
        <div class="header-actions">
          <label class="btn btn-secondary header-btn">Escolher foto<input type="file" accept="image/*" (change)="pickFile($event)" hidden></label>
          <button *ngIf="fotoUrl" class="btn btn-danger header-btn" (click)="deletePhoto()" [disabled]="isDeletingPhoto">{{ isDeletingPhoto ? 'Removendo...' : 'Remover foto' }}</button>
        </div>
      </div>
    </div>

    <div class="campo">
      <label>Nome de usuário</label>
      <input type="text" [(ngModel)]="novoNome" name="novoNome" />
      <button class="btn" (click)="changeName()">Salvar Nome</button>
    </div>

    <div class="campo">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" />
    </div>

    

    <hr />

    <div class="campo">
      <label>Senha Atual</label>
      <input type="password" [(ngModel)]="oldPassword" name="oldPassword" />
    </div>

    <div class="campo">
      <label>Nova Senha</label>
      <input type="password" [(ngModel)]="newPassword" name="newPassword" />
    </div>

    <div class="campo">
      <label>Confirmar Nova Senha</label>
      <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" />
      <button class="btn" (click)="changePassword()">Alterar Senha</button>
    </div>

    <div class="campo">
      <button class="btn" (click)="changeName()">Salvar Perfil</button>
    </div>

    <hr />

    <div class="campo text-center">
      <button class="btn-danger" (click)="deleteAccount()">Excluir Conta</button>
    </div>
  </div>
</div>
