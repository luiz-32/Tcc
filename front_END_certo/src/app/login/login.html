<div class="login-container">
  <a class="seta-voltar" href="/principal">←</a>

  <div class="login-box">
    <h1>LOGIN</h1>

    <form (ngSubmit)="fazerLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">EMAIL</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="Digite seu email"
        />
      </div>

      <div class="form-group">
        <label for="senha">SENHA:</label>
        <input
          type="password"
          id="senha"
          name="senha"
          [(ngModel)]="senha"
          required
          placeholder="Digite sua senha"
        />
      </div>

      <button type="submit">CONFIRMAR</button>
    </form>

    <div *ngIf="mensagem" class="mensagem">
      {{ mensagem }}
    </div>
  </div>
</div>
